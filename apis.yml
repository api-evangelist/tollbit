aid: tollbit
name: Tollbit
description: >-
  TollBit is the web stack for the agentic internet, giving publishers and
  commerce sites the infrastructure to analyze, control, and monetize AI agent
  access to their content. Publishers verify a property, stream logs for AI-bot
  analytics, and stand up an "Agent Site" front door (the tollbit.<domain>
  subdomain) that separates bot traffic from humans and applies content controls,
  licensing, and usage-based paywalls. Its developer API lets AI agents and
  builders discover licensable content through Licensed Search, fetch rates and
  license options, mint cryptographically signed one-time access tokens, retrieve
  licensed or indexed content as markdown or HTML, self-report usage, and receive
  webhook notifications when content changes. TollBit ships official Python and
  Node SDKs, a native CLI with a bundled Agent Skill, an MCP toolbox server, and
  additional agent access methods (NLWeb, Agent2Agent). Added to the API
  Evangelist network as a portfolio company of Lightspeed Venture Partners and
  enriched from its public developer surface.
